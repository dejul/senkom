# Lab only. Compose binds every published port to host loopback.
logLevel: warn
api: false
metrics: false
pprof: false
playback: false
rtmp: false
srt: false
moq: false

authMethod: http
authHTTPAddress: http://host.docker.internal:8000/api/v1/gateway/auth
authHTTPExclude: []

rtsp: true
rtspTransports: [tcp]
hls: true
hlsAllowOrigins:
  ['http://127.0.0.1:8889', 'http://127.0.0.1:5173', 'senkom://app']
webrtc: true
webrtcAllowOrigins:
  ['http://127.0.0.1:8889', 'http://127.0.0.1:5173', 'senkom://app']
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [127.0.0.1]

paths:
  lab:
    source: publisher
  lab-b:
    source: publisher
