name: Desktop Phase 1
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.26'
          extensions: mbstring, dom, xml, xmlwriter, pdo_mysql, curl, fileinfo, openssl
          tools: composer:2.11.1
          coverage: none
      - name: Install Node dependencies
        run: npm ci
      - name: Auto-merge policy self-check
        run: node --test scripts/auto-merge.test.mjs
      - name: Composer install from lockfile
        run: composer --working-dir apps/api install --no-interaction --prefer-dist
      - name: Composer validate
        run: composer --working-dir apps/api validate --strict
      - name: Composer audit
        run: composer --working-dir apps/api audit
      - name: PHP lint
        run: php apps/api/tools/lint.php
      - name: Disposable MySQL integration
        run: ./scripts/ci-mysql.ps1 -Action start
      - name: Migration and DEMO seed
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: senkom_ci_setup_test
          SENKOM_INFRASTRUCTURE_ENABLED: 'true'
          SENKOM_MAP_ID: ci-setup
        run: |
          $env:DB_PORT = $env:SENKOM_TEST_DB_PORT
          $env:DB_USERNAME = $env:SENKOM_TEST_DB_USERNAME
          $env:DB_PASSWORD = $env:SENKOM_TEST_DB_PASSWORD
          php apps/api/artisan migrate --force --no-interaction
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          php apps/api/artisan db:seed --class='Database\Seeders\DemoSeeder' --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Backend PHPUnit
        env:
          SENKOM_TEST_DB_DATABASE: senkom_ci_unit_test
        run: |
          php apps/api/vendor/phpunit/phpunit/phpunit -c apps/api/phpunit.xml --fail-on-skipped --no-progress --colors=never 2>&1 | Tee-Object .artifacts/ci-phpunit.log
          exit $LASTEXITCODE
      - name: Zero skipped mandatory tests
        run: |
          $result = Get-Content .artifacts/ci-phpunit.log -Raw
          $summary = [regex]::Match($result, 'OK \((\d+) tests?, (\d+) assertions?\)')
          if ($result -match '(?i)\bskipped\b' -or -not $summary.Success) { throw 'PHPUnit failed, skipped tests, or missing summary.' }
          $tests = [int]$summary.Groups[1].Value
          if ($tests -lt 1) { throw 'No backend tests ran.' }
          Write-Output "PHPUnit $tests tests, $($summary.Groups[2].Value) assertions, 0 skipped."
      - name: HTTP smoke
        env:
          SENKOM_TEST_DB_DATABASE: senkom_ci_http_test
        run: |
          $env:SENKOM_PHP_BINARY = (Get-Command php).Source
          node scripts/phase2-smoke.mjs --api-only
          exit $LASTEXITCODE
      - name: Laravel API routes
        run: php apps/api/artisan route:list --path=api
      - name: Frontend tests
        run: npm test
      - name: Schema tests
        run: npm test -- tests/map-schema.test.ts tests/map-v2.test.ts tests/cable-patch.test.ts
      - name: ESLint
        run: ./node_modules/.bin/eslint.cmd .
      - name: Prettier
        run: ./node_modules/.bin/prettier.cmd . --check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Electron smoke
        run: npm run smoke:desktop
      - name: OpenAPI contract
        run: npm run contracts:check
      - name: NPM audit
        run: npm audit --omit=dev
      - name: Stop disposable MySQL
        if: always()
        run: ./scripts/ci-mysql.ps1 -Action stop
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: desktop-smoke
          path: |
            .artifacts/*.png
            .artifacts/phase1-diagnostics.json
          if-no-files-found: ignore
