name: Desktop Phase 1
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.26'
          extensions: mbstring, dom, xml, xmlwriter, pdo_mysql, curl, fileinfo, openssl
          tools: composer:2.11.1
          coverage: none
      - run: npm ci
      - run: composer --working-dir apps/api install --no-interaction --prefer-dist
      - run: composer --working-dir apps/api validate --strict
      - run: npm run check
      - run: npm run smoke:desktop
      - run: npm audit --omit=dev
      - run: composer --working-dir apps/api audit
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: desktop-smoke
          path: |
            .artifacts/*.png
            .artifacts/phase1-diagnostics.json
          if-no-files-found: ignore
