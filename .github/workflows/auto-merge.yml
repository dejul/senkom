name: Verified work merge
on:
  workflow_run:
    workflows: [Desktop Phase 1]
    types: [completed]
permissions:
  actions: read
  contents: write
  pull-requests: read
concurrency:
  group: verified-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Evaluate trusted merge gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/auto-merge.mjs
